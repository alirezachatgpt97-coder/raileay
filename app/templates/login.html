<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ورود — {{ app_name }}</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="/static/style.css"></head><body class="auth-body"><div class="ambient a1"></div><div class="ambient a2"></div><main class="auth-wrap"><a class="brand auth-brand" href="/"><span class="brand-mark">م</span><span>منشی AI</span></a><section class="auth-card glass"><div class="auth-icon">✦</div><h1>{% if license_active %}ورود به پنل{% else %}فعال‌سازی لایسنس{% endif %}</h1><p id="subtitle">{% if license_active %}اطلاعات مدیر را وارد کنید.{% else %}برای شروع، لایسنس این نصب را فعال کنید.{% endif %}</p><div id="notice" class="notice hidden"></div><form id="licenseForm" class="{% if license_active %}hidden{% endif %}"><label>کلید لایسنس</label><div class="input-wrap"><input id="licenseKey" autocomplete="off" placeholder="MANSHI-XXXX-XXXX"><span>🔑</span></div><button class="primary-btn full" type="submit">فعال‌سازی</button><small class="hint">لایسنس آزمایشی این نسخه: <code>MANSHI-DEMO-2026</code></small></form><form id="loginForm" class="{% if not license_active %}hidden{% endif %}"><label>نام کاربری</label><input id="username" value="admin" autocomplete="username"><label>رمز عبور</label><input id="password" type="password" autocomplete="current-password"><button class="primary-btn full" type="submit">ورود به پنل</button></form></section><p class="auth-foot">داده‌های این نصب روی سرور خود شما نگهداری می‌شود.</p></main><script>
const notice=document.getElementById('notice'); function msg(t,ok=false){notice.textContent=t;notice.className='notice '+(ok?'ok':'bad')}
document.getElementById('licenseForm')?.addEventListener('submit',async e=>{e.preventDefault(); const r=await fetch('/api/license/activate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key:licenseKey.value})}); const j=await r.json(); if(j.ok){msg(j.message,true);licenseForm.classList.add('hidden');loginForm.classList.remove('hidden');document.querySelector('.auth-card h1').textContent='ورود به پنل';subtitle.textContent='لایسنس فعال شد. اطلاعات مدیر را وارد کنید.'}else msg(j.message)});
document.getElementById('loginForm')?.addEventListener('submit',async e=>{e.preventDefault(); const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:username.value,password:password.value})}); const j=await r.json(); if(j.ok) location='/panel'; else msg(j.message)});
</script></body></html>
